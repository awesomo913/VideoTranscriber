<line x1="0" y1="132" x2="252" y2="132" stroke="#a3281f" stroke-width="1" opacity="0.35"/>
<circle cx="126.0" cy="14" r="7" fill="#a3281f"/><circle cx="124.0" cy="12" r="2.2" fill="#d9776e"/>
<g transform="translate(46,52) rotate(-8)"><circle r="27" fill="none" stroke="#a3281f" stroke-width="3.5"/><circle r="21" fill="none" stroke="#a3281f" stroke-width="1.2"/><text y="10" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="700" fill="#a3281f">3</text></g>
<g transform="translate(190,52)"><rect x="-17" y="-17" width="34" height="34" rx="5" fill="none" stroke="#1b1814" stroke-width="3.5"/><g stroke="#1b1814" stroke-width="3.5" stroke-linecap="round"><line x1="-8" y1="-17" x2="-8" y2="-25"/><line x1="8" y1="-17" x2="8" y2="-25"/><line x1="-8" y1="17" x2="-8" y2="25"/><line x1="8" y1="17" x2="8" y2="25"/><line x1="-17" y1="-8" x2="-25" y2="-8"/><line x1="-17" y1="8" x2="-25" y2="8"/><line x1="17" y1="-8" x2="25" y2="-8"/><line x1="17" y1="8" x2="25" y2="8"/></g><text y="6" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="15" font-weight="700" fill="#a3281f">AI</text></g>
<text x="22" y="118" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#1b1814">faster-whisper</text>
<text x="22" y="166" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">runs on your CPU</text>
<text x="22" y="196" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">(or GPU)</text>
</g>
<g transform="translate(883,218.0)" fill="none" stroke="#1b1814" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 3 C9 -6 17 7 31 -1"/><path d="M21 -10 L33 -1 L20 7"/></g>
<g transform="translate(924,108) rotate(1.4 126.0 110.0)">
<g filter="url(#shadow)"><rect width="252" height="220" fill="#fbf7ec"/></g><rect width="252" height="220" fill="#fbf7ec"/>
<line x1="0" y1="132" x2="252" y2="132" stroke="#a3281f" stroke-width="1" opacity="0.35"/>
<circle cx="126.0" cy="14" r="7" fill="#a3281f"/><circle cx="124.0" cy="12" r="2.2" fill="#d9776e"/>
<g transform="translate(46,52) rotate(-8)"><circle r="27" fill="none" stroke="#a3281f" stroke-width="3.5"/><circle r="21" fill="none" stroke="#a3281f" stroke-width="1.2"/><text y="10" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="700" fill="#a3281f">4</text></g>
<g transform="translate(190,52)"><path d="M-16 -22 L6 -22 L16 -12 L16 22 L-16 22Z" fill="none" stroke="#1b1814" stroke-width="3.5" stroke-linejoin="round"/><g stroke="#1b1814" stroke-width="3" stroke-linecap="round"><line x1="-8" y1="-3" x2="8" y2="-3"/><line x1="-8" y1="5" x2="8" y2="5"/><line x1="-8" y1="13" x2="2" y2="13"/></g></g>
<text x="22" y="118" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#1b1814">.txt file</text>
<text x="22" y="166" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">saved to your</text>
<text x="22" y="196" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">Desktop</text>
</g>
</svg>
