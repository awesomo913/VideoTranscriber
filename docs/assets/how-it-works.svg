<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How VideoTranscriber works: pick a file, PyAV decodes it with bundled FFmpeg, faster-whisper transcribes on your CPU or GPU, and a .txt file is saved to your Desktop. Everything runs on your PC; nothing leaves your computer.">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.09 0"/></filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#3a2a12" flood-opacity="0.28"/></filter>
</defs>
<rect width="1200" height="360" fill="#f1e8d3"/><rect width="1200" height="360" filter="url(#grain)"/>
<rect x="8" y="8" width="1184" height="344" fill="none" stroke="#1b1814" stroke-width="2" opacity="0.18"/>
<text x="600.0" y="66" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="33" font-weight="700" fill="#1b1814">Everything runs on your PC — <tspan fill="#a3281f" font-style="italic">nothing leaves your computer</tspan></text>
<rect x="480.0" y="90" width="240" height="3.5" fill="#1b1814"/>
<g transform="translate(24,108) rotate(-1.4 126.0 110.0)">
<g filter="url(#shadow)"><rect width="252" height="220" fill="#fbf7ec"/></g><rect width="252" height="220" fill="#fbf7ec"/>
<line x1="0" y1="132" x2="252" y2="132" stroke="#a3281f" stroke-width="1" opacity="0.35"/>
<circle cx="126.0" cy="14" r="7" fill="#a3281f"/><circle cx="124.0" cy="12" r="2.2" fill="#d9776e"/>
<g transform="translate(46,52) rotate(-8)"><circle r="27" fill="none" stroke="#a3281f" stroke-width="3.5"/><circle r="21" fill="none" stroke="#a3281f" stroke-width="1.2"/><text y="10" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="700" fill="#a3281f">1</text></g>
<g transform="translate(190,52)"><path d="M-16 -22 L-16 22 L16 22 L16 -8 L2 -22Z M2 -22 L2 -8 L16 -8" fill="none" stroke="#1b1814" stroke-width="3.5" stroke-linejoin="round"/></g>
<text x="22" y="118" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#1b1814">Pick a file</text>
<text x="22" y="166" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">.mp4 .mov .wav</text>
<text x="22" y="196" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">.mp3 …</text>
</g>
<g transform="translate(283,218.0)" fill="none" stroke="#1b1814" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 3 C9 -6 17 7 31 -1"/><path d="M21 -10 L33 -1 L20 7"/></g>
<g transform="translate(324,108) rotate(1.0 126.0 110.0)">
<g filter="url(#shadow)"><rect width="252" height="220" fill="#fbf7ec"/></g><rect width="252" height="220" fill="#fbf7ec"/>
<line x1="0" y1="132" x2="252" y2="132" stroke="#a3281f" stroke-width="1" opacity="0.35"/>
<circle cx="126.0" cy="14" r="7" fill="#a3281f"/><circle cx="124.0" cy="12" r="2.2" fill="#d9776e"/>
<g transform="translate(46,52) rotate(-8)"><circle r="27" fill="none" stroke="#a3281f" stroke-width="3.5"/><circle r="21" fill="none" stroke="#a3281f" stroke-width="1.2"/><text y="10" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="700" fill="#a3281f">2</text></g>
<g transform="translate(190,52)"><g stroke="#1b1814" stroke-width="4" stroke-linecap="round"><line x1="-20" y1="-4" x2="-20" y2="4"/><line x1="-10" y1="-13" x2="-10" y2="13"/><line x1="0" y1="-21" x2="0" y2="21"/><line x1="10" y1="-11" x2="10" y2="11"/><line x1="20" y1="-4" x2="20" y2="4"/></g></g>
<text x="22" y="118" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#1b1814">PyAV decode</text>
<text x="22" y="166" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">bundled FFmpeg —</text>
<text x="22" y="196" font-family="'Courier New',Consolas,monospace" font-size="19" fill="#1b1814">no install</text>
</g>
<g transform="translate(583,218.0)" fill="none" stroke="#1b1814" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 3 C9 -6 17 7 31 -1"/><path d="M21 -10 L33 -1 L20 7"/></g>
<g transform="translate(624,108) rotate(-0.8 126.0 110.0)">
