<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How VideoTranscriber works: pick a file, PyAV decodes it, faster-whisper transcribes on your PC, you get a .txt file — nothing leaves your computer">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#4d96ff"/>
    </linearGradient>
    <g id="arrow">
      <line x1="0" y1="0" x2="132" y2="0" stroke="#3a7fd6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 124 -8 L 136 0 L 124 8" stroke="#4d96ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="280" fill="#14141f"/>

  <text x="600" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8aa3" letter-spacing="1.5" text-anchor="middle">EVERYTHING RUNS ON YOUR PC — NOTHING LEAVES YOUR COMPUTER</text>

  <!-- arrows between steps -->
  <use href="#arrow" x="204" y="130"/>
  <use href="#arrow" x="504" y="130"/>
  <use href="#arrow" x="804" y="130"/>

  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <!-- 1 Pick a file -->
    <g transform="translate(150,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <path d="M -16 -18 L -16 18 L 16 18 L 16 -6 L 2 -18 Z" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <path d="M 2 -18 L 2 -6 L 16 -6" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">1 · Pick a file</text>
      <text y="104" font-size="13" fill="#a9b4c4">.mp4 .mov .wav .mp3 …</text>
    </g>
    <!-- 2 PyAV decode -->
    <g transform="translate(450,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <g stroke="#f5f7fa" stroke-width="3.5" stroke-linecap="round">
        <line x1="-18" y1="-4" x2="-18" y2="4"/>
        <line x1="-9" y1="-12" x2="-9" y2="12"/>
        <line x1="0" y1="-18" x2="0" y2="18"/>
        <line x1="9" y1="-10" x2="9" y2="10"/>
        <line x1="18" y1="-3" x2="18" y2="3"/>
      </g>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">2 · PyAV decode</text>
      <text y="104" font-size="13" fill="#a9b4c4">bundled FFmpeg — no install</text>
    </g>
    <!-- 3 faster-whisper -->
    <g transform="translate(750,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <rect x="-18" y="-18" width="36" height="36" rx="7" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <g stroke="#f5f7fa" stroke-width="3" stroke-linecap="round">
        <line x1="-9" y1="-18" x2="-9" y2="-25"/><line x1="0" y1="-18" x2="0" y2="-25"/><line x1="9" y1="-18" x2="9" y2="-25"/>
        <line x1="-9" y1="18" x2="-9" y2="25"/><line x1="0" y1="18" x2="0" y2="25"/><line x1="9" y1="18" x2="9" y2="25"/>
      </g>
      <text y="6" font-size="13" font-weight="700" fill="#2ec4b6">AI</text>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">3 · faster-whisper</text>
      <text y="104" font-size="13" fill="#a9b4c4">runs on your CPU (or GPU)</text>
    </g>
    <!-- 4 .txt / .srt -->
    <g transform="translate(1050,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <path d="M -16 -20 L 6 -20 L 16 -10 L 16 20 L -16 20 Z" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="12" x2="2" y2="12" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">4 · .txt file</text>
      <text y="104" font-size="13" fill="#a9b4c4">saved to your Desktop</text>
    </g>
  </g>
</svg>
